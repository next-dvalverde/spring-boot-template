spring:
  application:
    name: atm

  datasource:
    url: jdbc:postgresql://localhost:5432/atm
    username: atm
    password: atm

  jpa:
    hibernate:
      # Nunca update ni create-drop: el schema lo manda Flyway y validate es lo
      # que hace que una migracion olvidada reviente el arranque, no en runtime.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    # Nunca subir a DEBUG en el paquete de sesion/PIN: el binding de parametros
    # de Hibernate imprimiria el hash y los intentos fallidos.
    es.nextdigital.atm: INFO
